<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lezzet Kapında</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#3cb868;--gd:#27914c;--gl:#e9f8ef;--gm:#cfeedb;--ink:#1d2b22;--mut:#6b7a70;--bg:#f6fbf8;--w:#fff;--red:#e5484d}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
header{position:sticky;top:0;z-index:20;background:var(--w);border-bottom:1px solid var(--gm);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{max-width:1180px;margin:auto;display:flex;gap:12px;align-items:center}
.logo{font-weight:900;font-size:22px;color:var(--gd);cursor:pointer;white-space:nowrap}
.logo b{background:var(--g);color:#fff;border-radius:8px;padding:0 6px;margin-right:4px}
.search{flex:1;background:var(--gl);border:1px solid var(--gm);border-radius:12px;padding:10px 14px;outline:0}
.search:focus{border-color:var(--g)}
.tbtn{background:var(--gl);color:var(--gd);border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
main{max-width:1180px;margin:auto;padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{flex:none;background:var(--w);border:1px solid var(--gm);border-radius:999px;padding:8px 16px;font-weight:700}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
h2{font-size:20px;font-weight:900;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rc{background:var(--w);border-radius:16px;overflow:hidden;border:1px solid var(--gm);cursor:pointer;transition:box-shadow .15s}
.rc:hover{box-shadow:0 6px 20px #3cb86826}
.rc .im{height:110px;background:var(--gl);display:grid;place-items:center;font-size:54px}
.rc .bd{padding:12px 14px}
.rc h3{font-size:17px;font-weight:900}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:6px}
.star{color:var(--gd);font-weight:900}
.lay{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.rh{background:var(--w);border:1px solid var(--gm);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.rh .em{font-size:44px;background:var(--gl);border-radius:14px;width:76px;height:76px;display:grid;place-items:center}
.item{background:var(--w);border:1px solid var(--gm);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.item .em{font-size:34px;background:var(--gl);border-radius:12px;width:60px;height:60px;display:grid;place-items:center;flex:none}
